name: Release

on:
  release:
    types: [published]

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Extract version from tag
        id: version
        run: |
          # Remove 'v' prefix from tag (e.g., v1.2.3 -> 1.2.3)
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Update manifest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MANIFEST="custom_components/atc_mithermometer/manifest.json"

          # Update version in manifest.json using jq
          jq --arg version "$VERSION" '.version = $version' "$MANIFEST" > "$MANIFEST.tmp"
          mv "$MANIFEST.tmp" "$MANIFEST"

          echo "Updated manifest.json to version $VERSION"
          cat "$MANIFEST"

      - name: Commit and push changes
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add custom_components/atc_mithermometer/manifest.json

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git commit -m "chore: update manifest.json to version ${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.event.release.target_commitish }}
          echo "committed=true" >> $GITHUB_OUTPUT

      - name: Move release tag to the bump commit
        if: steps.commit.outputs.committed == 'true'
        run: |
          # The release/tag was already published against the pre-bump
          # commit, so as-is it (and anything downloading the tag's source
          # archive, e.g. HACS without a custom zip_release asset
          # configured) would still see the OLD manifest.json version. Move
          # the tag itself to the bump commit so the tag - and therefore
          # the release - actually reflects the version it's named after.
          # Recreated as an annotated tag (matching what GitHub creates
          # when a release is published) rather than a lightweight one, so
          # this doesn't silently drop the tag's metadata.
          TAG="${{ github.event.release.tag_name }}"
          git tag -f -a "$TAG" -m "Release $TAG" HEAD
          git push origin "$TAG" --force

      - name: Create release asset zip
        run: |
          cd custom_components
          zip -r ../atc_mithermometer-${{ steps.version.outputs.version }}.zip atc_mithermometer/
          cd ..

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./atc_mithermometer-${{ steps.version.outputs.version }}.zip
          asset_name: atc_mithermometer-${{ steps.version.outputs.version }}.zip
          asset_content_type: application/zip
